name: Windows installer
# Builds CCGuard.exe (PyInstaller) and CCGuard-Setup-<version>.exe (Inno Setup 6) from source,
# verifies the installer (silent install, self-test, silent uninstall) and, for a published
# release, attaches the installer and its checksum to that release.
on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packaging/**'
      - 'tools/build_windows.py'
      - 'requirements-build.txt'
      - 'skills/claude-guardian/scripts/**'
      - 'skills/claude-guardian/assets/monitor/**'
      - '.github/workflows/windows-installer.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write   # only used by the release upload step
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned build tools
        run: python -m pip install -r requirements-build.txt
      - name: Install Inno Setup 6 if missing
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
      - name: Build, self-test and verify installer
        shell: pwsh
        run: |
          # A release tag must equal scripts/version.py; other builds use version.py as is.
          $tag = @()
          if ('${{ github.event_name }}' -eq 'release') { $tag = @('--version', '${{ github.event.release.tag_name }}') }
          python tools/build_windows.py @tag --installer --verify-installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: CCGuard-Setup
          path: |
            dist/CCGuard-Setup-*.exe
            dist/SHA256SUMS-installer-*.txt
          if-no-files-found: error
      - name: Attach installer to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $files = @(Get-ChildItem dist -Filter 'CCGuard-Setup-*.exe') + @(Get-ChildItem dist -Filter 'SHA256SUMS-installer-*.txt')
          gh release upload '${{ github.event.release.tag_name }}' $files.FullName --clobber
