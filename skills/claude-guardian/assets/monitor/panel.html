<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CCGuard</title>
<link rel="stylesheet" href="panel.css"></head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <img id="logo" src="logo-unknown.png" alt="" width="36" height="36">
      <span class="wordmark">CCGuard</span>
    </div>
    <nav aria-label="页面">
      <button class="nav active" data-page="status" type="button"><span>状态</span><b id="badge" class="badge" hidden></b></button>
      <button class="nav" data-page="exit" type="button"><span>出口</span></button>
      <button class="nav" data-page="history" type="button"><span>历史</span></button>
      <button class="nav" data-page="log" type="button"><span>日志</span></button>
      <button class="nav" data-page="settings" type="button"><span>设置</span></button>
    </nav>
    <label class="switch-row"><span>开机自启</span>
      <input id="autostart" type="checkbox" role="switch"><i class="switch" aria-hidden="true"></i></label>
  </aside>

  <main>
    <header class="top">
      <div>
        <h1>本机防护</h1>
        <p id="subtitle" class="subtitle">正在读取…</p>
      </div>
      <button id="refresh" class="btn" type="button" title="F5">立即采集</button>
    </header>

    <section id="page-status" class="page active">
      <div class="inner">
        <div id="banner" class="banner unknown" aria-live="polite">
          <span id="headline" class="headline">正在读取…</span>
          <span id="detail" class="detail"></span>
        </div>
        <div id="cards" class="cards"></div>
      </div>
    </section>

    <section id="page-exit" class="page">
      <div class="inner">
        <div id="score-card" class="panel score-card unknown">
          <div class="score"><span id="score-value">—</span><span id="score-label" class="chip unknown">未检测</span></div>
          <div class="score-meta">
            <div id="score-ip" class="score-ip"></div>
            <div id="score-time" class="subtitle"></div>
          </div>
          <span class="spacer"></span>
          <button id="score-detail" class="btn" type="button">浏览器打开详情</button>
          <button id="score-run" class="btn primary" type="button">检测</button>
        </div>
        <div class="exit-grid">
          <dl id="score-facts" class="panel facts">
            <dt>位置</dt><dd data-fact="location">—</dd>
            <dt>网络</dt><dd data-fact="network">—</dd>
            <dt>类型</dt><dd data-fact="kind">—</dd>
            <dt>时区</dt><dd data-fact="timezone">—</dd>
            <dt>标记</dt><dd data-fact="flags">—</dd>
            <dt>来源</dt><dd class="credit">出口 IP 由 Cloudflare 1.1.1.1 返回；信任分与 IP 属性由 <button id="score-credit" class="link" type="button">ip.net.coffee</button> 提供</dd>
          </dl>
          <div class="panel steps-log">
            <h3>检测过程</h3>
            <ol id="score-log" class="evidence"><li class="muted">点“检测”后向 1.1.1.1 和 ip.net.coffee 各发一次请求</li></ol>
          </div>
        </div>
      </div>
    </section>

    <section id="page-history" class="page">
      <div class="inner">
        <div class="toolbar">
          <div class="segmented" role="group" aria-label="时间范围">
            <button class="seg active" data-window="86400" type="button">24 小时</button>
            <button class="seg" data-window="604800" type="button">7 天</button>
          </div>
          <span class="spacer"></span>
          <span class="legend"><i class="ok"></i>正常<i class="degraded"></i>降级<i class="fail"></i>失效<i class="unknown"></i>未知<i class="off"></i>未监测</span>
        </div>
        <div id="history" class="panel history"></div>
      </div>
    </section>

    <section id="page-log" class="page">
      <div class="toolbar">
        <span class="spacer"></span>
        <button id="copy-log" class="btn" type="button">复制全部</button>
        <button id="clear-log" class="btn" type="button">清空</button>
      </div>
      <div id="log" class="log panel" role="log"></div>
    </section>

    <section id="page-settings" class="page">
      <form id="settings" class="panel form" autocomplete="off">
        <div class="field"><label for="interval">采集间隔</label>
          <input id="interval" type="number" min="2" max="3600" step="1" required><span class="unit">秒</span></div>
        <div class="field"><label for="cooldown">通知冷却</label>
          <input id="cooldown" type="number" min="0" max="86400" step="1" required><span class="unit">秒</span></div>
        <div class="field"><span class="label">提醒</span>
          <div class="checks">
            <label class="check"><input type="checkbox" name="notify" value="fail"><i></i>失效</label>
            <label class="check"><input type="checkbox" name="notify" value="degraded"><i></i>降级</label>
            <label class="check"><input type="checkbox" name="notify" value="unknown"><i></i>未知</label>
          </div></div>
        <div class="field"><span class="label"></span>
          <label class="check"><input id="paused" type="checkbox"><i></i>暂停提醒</label></div>
        <div class="actions">
          <button class="btn primary" type="submit">应用</button>
          <button id="save" class="btn" type="button">保存到配置</button>
          <span class="spacer"></span>
          <button id="open-config" class="btn ghost" type="button">打开配置文件</button>
        </div>
      </form>
    </section>

    <aside id="drawer" class="drawer" hidden aria-labelledby="drawer-title">
      <div class="drawer-head">
        <h2 id="drawer-title"></h2>
        <span id="drawer-chip" class="chip"></span>
        <span class="spacer"></span>
        <button id="drawer-close" class="icon" type="button" aria-label="关闭">✕</button>
      </div>
      <p id="drawer-checks" class="drawer-checks"></p>
      <ol id="drawer-steps" class="steps"></ol>
      <h3>检测过程</h3>
      <p id="drawer-source" class="source"></p>
      <ul id="drawer-evidence" class="evidence"></ul>
      <h3>最近 24 小时</h3>
      <div id="drawer-bar" class="bar"></div>
      <div class="drawer-foot"><span id="drawer-changed"></span><code id="drawer-code"></code></div>
    </aside>

    <div id="toast" class="toast" role="status" hidden></div>
  </main>
</div>

<dialog id="close-dialog">
  <h3 id="close-question"></h3>
  <div class="dialog-actions">
    <button class="btn" value="cancel" type="button">取消</button>
    <button class="btn" value="exit" type="button">退出</button>
    <button class="btn primary" value="hide" type="button">隐藏到托盘</button>
  </div>
</dialog>
<script src="panel.js"></script>
</body></html>
